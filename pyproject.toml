[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frameview"
version = "0.1.0"
description = "Local-first video frame selection and transcript alignment pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
frameview = "frameview.cli:main"

[tool.setuptools.packages.find]
include = ["frameview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
