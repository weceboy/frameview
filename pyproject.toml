[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frameview"
version = "0.2.0"
description = "Local-first, transcript-aware video understanding pipeline and API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
url = ["yt-dlp>=2025.1.0"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
all = ["faster-whisper>=1.0", "yt-dlp>=2025.1.0", "fastapi>=0.115", "uvicorn[standard]>=0.34"]
dev = ["pytest>=8.0"]

[project.scripts]
frameview = "frameview.cli:main"

[tool.setuptools.packages.find]
include = ["frameview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
